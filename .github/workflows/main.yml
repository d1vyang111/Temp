name: Exp2-Prototype
on: [push]

jobs:
  run-azure-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4 for Node 24 support

      - name: Azure Login
        uses: azure/login@v2 # Updated to v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Install ML Extension
        run: az extension add -n ml

      - name: Trigger Job
        run: |
          az ml job create --file job.yml --resource-group MyMLResourceGroup --workspace-name MyFirstWorkspace
