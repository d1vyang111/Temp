name: Exp2-Prototype
on: [push]

jobs:
  run-azure-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Job
        run: |
          az extension add -n ml
          # Using your specific workspace and resource group names
          az ml job create --file job.yml --resource-group MyMLResourceGroup --workspace-name MyFirstWorkspace
